name: CI

on:
  push:
    branches: [main]
  pull_request:

# RUMI is a single Rust/Axum binary over SQLite serving a Vite + React SPA.
# The jobs mirror the CLAUDE.md quality gates. No secrets are needed.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain `cargo audit` (RustSec) instead of rustsec/audit-check: it needs
      # no `checks: write` token, so the workflow stays read-only.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock
        working-directory: backend
        run: cargo audit

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` on purpose: the action reads package.json
      # "packageManager" (pnpm@10.33.2), and setting both makes it fail.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests + coverage (>= 80% lines)
        run: pnpm coverage
      - name: Build SPA
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q
      - name: Build image
        run: docker compose build
      # Catches an image that builds but can't run (e.g. a glibc mismatch).
      - name: Smoke test (container turns healthy)
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/health
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
