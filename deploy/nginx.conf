# RUMI nginx site template — rendered by deploy/deploy.sh ({{DOMAIN}},
# {{APP_DIR}}, {{APP_PORT}}) into /etc/nginx/sites-available/rumi. certbot
# --nginx then adds the TLS listener and the http -> https redirect.
#
# nginx serves the built SPA (dist/) straight from disk; only /api/ and
# /healthz reach the Rust binary on 127.0.0.1:{{APP_PORT}}.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    root {{APP_DIR}}/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header is inherited from an outer level ONLY when a location sets
    # none of its own, so each static location below repeats the PRD §5.12
    # security headers. Proxied locations get them from the Rust app instead
    # (adding them here would send them twice).

    # SPA: a real file if one exists, otherwise index.html (client-side
    # routes). no-cache so a deploy's new index.html, and with it the new
    # hashed asset names, is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Vite's content-hashed bundles: cache for a year. A missing asset is a
    # hard 404, never index.html (which would be served as JS/CSS with a 200).
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # JSON API.
    # - `Host $host` is load-bearing: the CSRF check (PRD §5.3.3) compares the
    #   browser's Origin host[:port] with the request Host. nginx's default
    #   would send "127.0.0.1:{{APP_PORT}}" and mutating calls would only pass
    #   via the PUBLIC_BASE_URL fallback.
    # - X-Real-IP / X-Forwarded-For are trusted only from a loopback peer
    #   (nginx) and key the per-IP auth rate limiter (§5.3.4).
    # - X-Forwarded-Proto lets COOKIE_SECURE=auto mark the cookie Secure.
    location /api/ {
        proxy_pass http://127.0.0.1:{{APP_PORT}}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
